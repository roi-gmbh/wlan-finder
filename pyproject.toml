[project]
name = "wlan-finder"
version = "0.1.0"
description = "Findet WLANs am Standort, bietet den Wechsel an und meldet sich KI-gestuetzt an Captive Portals an."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "playwright>=1.47",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
wlan-finder = "wlanfinder.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wlanfinder*"]

[tool.setuptools.package-data]
wlanfinder = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
